name: Deploy to GitHub Pages

# Explicit Pages deployment. Replaces the auto-generated "Deploy from a branch"
# pipeline, which was leaving deployments stuck in `deployment_queued` until the
# 10-minute timeout. configure-pages (enablement: true) re-initializes the Pages
# source as "GitHub Actions", which clears that stuck state.

on:
  push:
    branches: ["claude/zarna-garg-sidescroller-a4mxa7"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; let a running publish finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
