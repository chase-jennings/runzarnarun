// ============ CONFIG ============
const TILE=16, BASE_W=288, BASE_H=144;
const cv=document.getElementById('c'), cx=cv.getContext('2d');
let VW=BASE_W, VH=BASE_H, ZOOM=2;

// ============ OPTIONAL REAL ARTWORK (auto-used if committed to repo) ============
const ART={};
// title = repo-root intro2.png; family (optional) = repo-root family.png
[['title','intro2.jpg?v=2'],['family','family.png?v=1']].forEach(([n,src])=>{const im=new Image();im.onload=()=>{ART[n]=im;};im.src=src;});
function drawCover(im){
  const s=Math.max(VW/im.width,VH/im.height), w=im.width*s, h=im.height*s;
  cx.drawImage(im,(VW-w)/2,(VH-h)/2,w,h);
}

// ============ ADAPTIVE VIEWPORT (self-healing) ============
let lastFit='';
function fitKey(){
  const v=window.visualViewport;
  return innerWidth+'x'+innerHeight+(v?('|'+(v.width|0)+','+(v.height|0)+','+v.scale):'');
}
function fit(){
  lastFit=fitKey();
  const v=window.visualViewport;
  const w=v?Math.round(v.width):innerWidth, h=v?Math.round(v.height):innerHeight;
  ZOOM=Math.max(1,Math.min(Math.floor(w/192),Math.floor(h/144)));
  while(ZOOM>1&&(w/ZOOM<160||h/ZOOM<120))ZOOM--;
  VW=Math.ceil(w/ZOOM); VH=Math.ceil(h/ZOOM);
  cv.width=VW; cv.height=VH;
  cv.style.width=(VW*ZOOM)+'px'; cv.style.height=(VH*ZOOM)+'px';
  cx.imageSmoothingEnabled=false;
}
fit();
addEventListener('resize',fit);
addEventListener('pageshow',fit);
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit);}
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ============ INPUT ============
const keys={};
let anyPress=false, anyPressEdge=false;
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(!keys[e.code]){if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jumpPressed=true; if(e.code==='KeyX'||e.code==='KeyF')firePressed=true; anyPressEdge=true;}
  keys[e.code]=true; anyPress=true; initAudio();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
let jumpPressed=false, firePressed=false, jumpHeld=false;
// touch state
const touches={}; // id -> {sx,sy,x,y,zone}
let joyId=null, joyBase=null, joyNub=null, joyDX=0;
let jumpBtnId=null, fireBtnId=null;
function btnRects(){
  const jr=VH-30, jx=VW-32, fx=VW-74;
  return {jump:{x:jx,y:jr,r:20},fire:{x:fx,y:jr,r:16}};
}
function tpos(t){const r=cv.getBoundingClientRect();return{x:(t.clientX-r.left)/ZOOM,y:(t.clientY-r.top)/ZOOM};}
cv.addEventListener('touchstart',e=>{
  e.preventDefault(); initAudio(); anyPress=true; anyPressEdge=true;
  for(const t of e.changedTouches){
    const p=tpos(t), b=btnRects();
    if(Math.hypot(p.x-b.jump.x,p.y-b.jump.y)<b.jump.r+8){jumpBtnId=t.identifier;jumpPressed=true;jumpHeld=true;continue;}
    if(Math.hypot(p.x-b.fire.x,p.y-b.fire.y)<b.fire.r+8){fireBtnId=t.identifier;firePressed=true;continue;}
    if(p.x<VW/2){ if(joyId===null){joyId=t.identifier;joyBase={x:p.x,y:p.y};joyNub={x:p.x,y:p.y};joyDX=0;} }
    else {jumpPressed=true;jumpHeld=true;if(jumpBtnId===null)jumpBtnId=t.identifier;} // right-half tap = jump fallback
  }
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p=tpos(t);
    if(t.identifier===joyId){
      const dx=p.x-joyBase.x;
      joyNub={x:joyBase.x+Math.max(-16,Math.min(16,dx)),y:joyBase.y+Math.max(-16,Math.min(16,p.y-joyBase.y))};
      joyDX=Math.abs(dx)<4?0:Math.max(-1,Math.min(1,dx/16));
    }
  }
},{passive:false});
function endTouch(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){joyId=null;joyBase=null;joyNub=null;joyDX=0;}
    if(t.identifier===jumpBtnId){jumpBtnId=null;jumpHeld=false;}
    if(t.identifier===fireBtnId){fireBtnId=null;}
  }
}
cv.addEventListener('touchend',endTouch,{passive:false});
cv.addEventListener('touchcancel',endTouch,{passive:false});
cv.addEventListener('mousedown',()=>{initAudio();anyPress=true;anyPressEdge=true;});
function inputDir(){
  let d=0;
  if(keys['ArrowLeft']||keys['KeyA'])d-=1;
  if(keys['ArrowRight']||keys['KeyD'])d+=1;
  if(joyDX)d=joyDX;
  return d;
}
function inputJumpHeld(){return jumpHeld||keys['Space']||keys['ArrowUp']||keys['KeyW'];}

function drawText(g,s,x,y,col){
  s=(''+s).toUpperCase();
  g.fillStyle=col||'#fff';
  let px=x;
  for(const ch of s){
    const m=FONT[ch]||FONT['?'];
    for(let i=0;i<15;i++)if(m[i]==='1')g.fillRect(px+(i%3),y+(i/3|0),1,1);
    px+=4;
  }
  return px-x;
}
function textW(s){return s.length*4-1;}
function outText(g,s,x,y,col,out){
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(dx||dy)drawText(g,s,x+dx,y+dy,out||'#1a1028');
  drawText(g,s,x,y,col);
}
function centerText(g,s,y,col,out){outText(g,s,Math.round((VW-textW(s))/2),y,col,out);}

// ============ SPRITE ENGINE ============
function spr(rows,pal){
  const w=rows[0].length,h=rows.length;
  const o=document.createElement('canvas');o.width=w;o.height=h;
  const g=o.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x];
    if(!ch||ch==='.'||ch===' ')continue;
    g.fillStyle=pal[ch]||'#f0f';g.fillRect(x,y,1,1);
  }
  return o;
}
function flipSpr(s){
  const o=document.createElement('canvas');o.width=s.width;o.height=s.height;
  const g=o.getContext('2d');g.translate(s.width,0);g.scale(-1,1);g.drawImage(s,0,0);
  return o;
}

// note name -> freq
function nf(n){ // e.g. 'C4'
  if(!n)return 0;
  const NAMES={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const m=n.match(/^([A-G]#?)(\d)$/); if(!m)return 0;
  return 440*Math.pow(2,(NAMES[m[1]]+(+m[2]-4)*12-9)/12);
}
function tone(t,f,dur,type,vol,slide){
  if(!AC||!f)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(vol||0.08,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+0.02);
}
let noiseBuf=null;
function noise(t,dur,vol,hp){
  if(!AC)return;
  if(!noiseBuf){
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;s.loop=true;
  f.type=hp?'highpass':'bandpass';f.frequency.value=hp||1200;f.Q.value=1;
  g.gain.setValueAtTime(vol||0.06,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(AC.destination);
  s.start(t);s.stop(t+dur+0.02);
}

function setTrack(tr){
  if(curTrack===tr)return;
  curTrack=tr;stepIdx=0;
  if(AC)nextNoteT=AC.currentTime+0.06;
}
function schedule(){
  if(!AC||!curTrack)return;
  const spb=60/curTrack.bpm/2; // 8th notes
  while(nextNoteT<AC.currentTime+0.13){
    const st=curTrack.steps[stepIdx%curTrack.steps.length];
    const [ld,bs,pc]=st;
    const wv=curTrack.wave||'square';
    if(ld){tone(nextNoteT,nf(ld),spb*0.9,wv,curTrack.lv);
      if(curTrack.fifth)tone(nextNoteT,nf(ld)*1.5,spb*0.9,wv,curTrack.lv*0.7);}
    if(bs)tone(nextNoteT,nf(bs),spb*0.95,curTrack.fifth?'sawtooth':'triangle',curTrack.lv*1.6);
    const pv=curTrack.fifth?1.6:1;
    if(pc==='k'){tone(nextNoteT,150,0.09,'sine',0.10*pv,-100);noise(nextNoteT,0.035,0.03*pv,3000);}
    else if(pc==='n')noise(nextNoteT,0.07,0.055*pv,1800);
    else if(pc==='h')noise(nextNoteT,0.025,0.025*pv,6000);
    nextNoteT+=spb;stepIdx++;
  }
}

function rectVsTiles(px,py,w,h){ // returns overlapping solid
  const x0=Math.floor(px/TILE),x1=Math.floor((px+w-1)/TILE),y0=Math.floor(py/TILE),y1=Math.floor((py+h-1)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(SOLID(T(tx,ty)))return{tx,ty};
  return null;
}

  e.x+=e.vx;
  let c=rectVsTiles(e.x,e.y,e.w,e.h);
  if(c){if(e.vx>0)e.x=c.tx*TILE-e.w-0.01;else if(e.vx<0)e.x=(c.tx+1)*TILE+0.01;res.hitX=true;e.vx=0;}
  const wasBottom=e.y+e.h;
  e.y+=e.vy;
  c=rectVsTiles(e.x,e.y,e.w,e.h);
  if(c){
    if(e.vy>0){e.y=c.ty*TILE-e.h;res.onGround=true;}
    else if(e.vy<0){e.y=(c.ty+1)*TILE;res.headTile=c;}
    e.vy=0;
  }
  // ground stick: when descending/resting, snap feet flush to the tile just
  // below so a resting entity holds an exact Y (no gravity/detect jitter). Also
  // handles one-way scaffolds (only when landing on them from above).
  if(e.vy>=0&&!res.onGround){
    const feet=e.y+e.h;
    const ty=Math.floor((feet+1.5)/TILE);
    const top=ty*TILE;
    if(feet>=top-2&&feet<=top+2){
      const x0=Math.floor((e.x+1)/TILE),x1=Math.floor((e.x+e.w-2)/TILE);
      for(let tx=x0;tx<=x1;tx++){
        const v=T(tx,ty);
        if(SOLID(v)||(v===3&&wasBottom<=top+3)){e.y=top-e.h;e.vy=0;res.onGround=true;break;}
      }
    }
  }
  return res;
}

// ============ UPDATE: PLAY ============
function updatePlay(){
  levelTime++;
  if(playHintT>0){playHintT--;if(inputDir())playHintT=Math.min(playHintT,24);}
  const p=player;
  const spd=(chaiT>0?2.1:1.4)*(micT>0?1.15:1);
  const d=inputDir();
  if(d){p.vx+=(d*spd-p.vx)*0.3;p.dir=d>0?1:-1;}
  else p.vx*=0.7;
  if(Math.abs(p.vx)<0.05)p.vx=0;
  // jump buffer & coyote
  if(jumpPressed){p.jbuf=8;jumpPressed=false;}
  else if(p.jbuf>0)p.jbuf--;
  if(p.grounded){p.coyote=7;p.airJumps=1;}else if(p.coyote>0)p.coyote--;
  if(p.jbuf>0&&(p.coyote>0||p.airJumps>0)){
    if(p.coyote>0){p.vy=-5.1;p.coyote=0;}            // ground / coyote jump
    else{p.vy=-4.7;p.airJumps--;puff(p.x+p.w/2,p.y+p.h,'#d8f4ff',6);} // mid-air double jump
    p.jbuf=0;p.grounded=false;SFX.jump();
  }
  if(!inputJumpHeld()&&p.vy<-2.0)p.vy=-2.0; // variable height
  p.vy=Math.min(p.vy+0.24,5);
  const r=moveEntity(p);
  p.grounded=r.onGround;
  if(r.headTile&&p.vy===0)bumpTile(r.headTile.tx,r.headTile.ty);
  if(p.grounded){
    p.anim+=Math.abs(p.vx)*0.12;
    // record safe spot (not over manhole/road-with-close-taxi/gap edge)
    const txc=Math.floor((p.x+p.w/2)/TILE);
    if(T(txc,GROUND)===1&&frame%20===0){lastSafe={x:p.x,y:p.y};}
  }
  // safety net (should not trigger — ground is continuous)
  if(p.y>LH*TILE+20){hurtPlayer();if(hearts>0){p.x=lastSafe.x;p.y=lastSafe.y;p.vx=0;p.vy=0;invT=90;}}
  // fire pan
  if(firePressed){
    firePressed=false;
    if(p.throwT<=0){
      p.throwT=18;SFX.throwSfx();
      pans.push({x:p.x+p.w/2,y:p.y+8,vx:p.dir*3.2,dir:p.dir,life:55});
    }
  }
  if(p.throwT>0)p.throwT--;
  if(invT>0)invT--;
  if(micT>0){micT--;if(micT===0)setTrack(giantT>0?TR_GIANT:TR_MAIN);if(micT%22===0)SFX.laugh();}
  if(giantT>0){giantT--;
    if(giantT===0)setTrack(micT>0?TR_MIC:TR_MAIN);
    if(frame%4===0)parts.push({x:p.x+Math.random()*14-2,y:p.y+Math.random()*22,vx:0,vy:-0.5,t:0,life:14,col:'#ffd23f'});
  }
  if(chaiT>0){chaiT--;if(chaiT%3===0)parts.push({x:p.x+(p.dir<0?p.w:0),y:p.y+14,vx:-p.dir*0.5,vy:-0.6,t:0,life:18,col:'#e8e8f4'});}
  // checkpoints
  checkpoints.forEach((c,i)=>{if(!c.used&&p.x+p.w>c.x){c.used=true;lastCP=i;SFX.powerup();addPop(c.x,GROUND*TILE-40,'CHECKPOINT!','#7dff7d');}});
  // MIL swoops
  milSwoops.forEach(s=>{
    if(!s.done&&p.x>s.x){s.done=true;SFX.cackle();
      mil={x:camX-30,y:24,t:0,drops:1,line:s.line};
      milBubble={text:s.line,t:0};
    }
  });
  if(mil){
    mil.t++;mil.x+=1.7;mil.y=24+Math.sin(mil.t*0.05)*8;
    if(mil.drops>0&&mil.t%50===30&&mil.x>camX+20&&mil.x<camX+VW-20){mil.drops--;rotis.push({x:mil.x+8,y:mil.y+16,vx:0.3,vy:0.5,rot:0});SFX.sizzle();}
    if(mil.x>camX+VW+60)mil=null;
  }
  if(milBubble){milBubble.t++;if(milBubble.t>160)milBubble=null;}
  // pans
  for(const pn of pans){
    pn.x+=pn.vx;pn.life--;
    if(pn.life<=0)pn.gone=true;
    if(rectVsTiles(pn.x-4,pn.y-2,8,4)){pn.gone=true;SFX.clang();puff(pn.x,pn.y,'#9aa2ae',4);}
  }
  pans=pans.filter(pn=>!pn.gone&&pn.x>camX-40&&pn.x<camX+VW+60);
  // rotis
  for(const rt of rotis){
    rt.x+=rt.vx;rt.vy=Math.min(rt.vy+0.06,1.5);rt.y+=rt.vy;rt.rot+=0.2;
    if(Math.abs(rt.x-(p.x+p.w/2))<7&&Math.abs(rt.y-(p.y+p.h/2))<11){rt.gone=true;hurtPlayer();}
    if(rt.y>GROUND*TILE-4){rt.gone=true;puff(rt.x,GROUND*TILE-2,'#8a5a28',4);}
  }
  rotis=rotis.filter(rt=>!rt.gone);
  // taxis
  for(const tx of taxis){
    tx.x-=0.5;
    if(tx.x<(tx.road[0]-4)*TILE){tx.x=(tx.road[1]+3)*TILE;tx.horned=false;}
    const ty=GROUND*TILE-14;
    if(!tx.horned&&Math.abs(tx.x-p.x)<110&&Math.abs(p.y-ty)<40){tx.horned=true;SFX.horn();}
    if(p.x+p.w>tx.x+3&&p.x<tx.x+tx.w-3&&p.y+p.h>ty+2&&p.y<ty+tx.h){
      if(p.vy>0.5&&p.y+p.h<ty+9){p.vy=-4;SFX.stomp();} // bounce off roof
      else hurtPlayer();
    }
  }
  // entities
  for(const e of ents){
    if(e.dead){ // dizzy spiral away
      e.bonkT++;e.x+=e.vx;e.y+=e.vy;e.vy+=0.12;e.rot=(e.rot||0)+0.3;
      if(e.bonkT>90)e.gone=true;
      continue;
    }
    const dx=(p.x+p.w/2)-(e.x+e.w/2), adx=Math.abs(dx), near=adx<130;
    if(e.type==='aunt'){
      if(micT>0){e.dir=dx>0?-1:1;e.x+=e.dir*1.4;} // flee!
      else{
        if(near)e.dir=dx>0?1:-1;
        e.vx=e.dir*0.25;e.vy=Math.min(e.vy+0.24,5);
        const er=moveEntity(e);
        if(er.hitX)e.dir*=-1;
        // don't walk off ledges
        const ahead=Math.floor((e.x+e.w/2+e.dir*10)/TILE);
        if(er.onGround&&!SOLID(T(ahead,GROUND))&&T(ahead,GROUND)!==3)e.dir*=-1;
      }
      if(near&&frame%150===((e.x|0)%150))SFX.haihai();
    }else if(e.type==='pig'){
      if(micT>0){e.y-=1.2;e.x+=(dx>0?-1:1)*0.8;}
      else if(e.mode==='sit'){
        if(adx<70&&p.y>e.y){e.mode='dive';e.diveT=0;SFX.flap();}
      }else if(e.mode==='dive'){
        e.diveT++;
        e.x+=(dx>0?1:-1)*0.7;
        e.y+=Math.sin(Math.min(e.diveT*0.04,1.4))*1.2;
        if(e.y>GROUND*TILE-24||e.diveT>120){e.mode='rise';}
      }else{ e.y-=0.8; if(e.y<=e.homeY){e.y=e.homeY;e.mode='sit';} }
    }else if(e.type==='rat'){
      if(micT>0){e.dir=dx>0?-1:1;}
      else if(near)e.dir=dx>0?1:-1;
      e.vx=e.dir*(near?0.7:0.4);e.vy=Math.min(e.vy+0.24,5);
      const er=moveEntity(e);
      if(er.hitX)e.dir*=-1;
      const ahead=Math.floor((e.x+e.w/2+e.dir*10)/TILE);
      if(er.onGround&&!SOLID(T(ahead,GROUND))&&T(ahead,GROUND)!==3)e.dir*=-1;
      if(near&&frame%120===((e.x|0)%120))SFX.squeak();
    }
    // player vs enemy
    if(e.type!=='pine'&&e.type!=='chai'&&e.type!=='samosa'&&e.type!=='mic'){
      const ey=e.y+(e.oy||0);
      if(p.x+p.w>e.x+2&&p.x<e.x+e.w-2&&p.y+p.h>ey+2&&p.y<ey+e.h-2){
        if(micT>0||giantT>0)bonk(e,'pan');
        else if(p.vy>0.5&&p.y+p.h<ey+e.h*0.55&&e.type!=='rat'){bonk(e,'stomp');p.vy=-3.6;}
        else if(e.type==='rat'&&p.vy>0.5&&p.y+p.h<ey+5){bonk(e,'stomp');p.vy=-3.6;}
        else hurtPlayer();
      }
      // pans vs enemy
      for(const pn of pans){
        if(!pn.gone&&pn.x>e.x-4&&pn.x<e.x+e.w+4&&pn.y>ey-4&&pn.y<ey+e.h+4){pn.gone=true;bonk(e,'pan');}
      }
    }else{
      // pickups
      const ey=e.y;
      if(p.x+p.w>e.x-2&&p.x<e.x+e.w+2&&p.y+p.h>ey-4&&p.y<ey+e.h+4){
        e.gone=true;
        if(e.type==='pine'){collectPine();addPop(e.x,e.y-8,'+50','#ffd23f');}
        else if(e.type==='samosa'){gainHeart();SFX.powerup();addPop(e.x,e.y-8,'SAMOSA!','#d99a3c');}
        else if(e.type==='chai'){chaiT=480;SFX.powerup();addPop(e.x,e.y-8,'CHAI RUSH!','#e8b090');}
        else if(e.type==='mic'){micT=600;setTrack(TR_MIC);SFX.powerup();addPop(e.x,e.y-10,'COMEDY SPECIAL!','#7df');}
      }
    }
  }
  ents=ents.filter(e=>!e.gone);
  // popups & particles
  for(const o of pops)o.t++;
  pops=pops.filter(o=>o.t<50);
  for(const o of parts){o.t++;o.x+=o.vx;o.y+=o.vy;o.vy+=0.03;}
  parts=parts.filter(o=>o.t<o.life);
  // end of level
  if(p.x+p.w>END_X){state='RESCUE';sceneT=0;mil=null;milBubble=null;rotis=[];setTrack(TR_WIN);SFX.cheer();}
  // camera
  camX=Math.max(0,Math.min(p.x-VW*0.38,LW*TILE-VW));
  const yLo=Math.min(0,LH*TILE-VH), yHi=Math.max(yLo,LH*TILE-VH);
  const targY=Math.max(yLo,Math.min(p.y-VH*0.55,yHi));
  camY+=(targY-camY)*0.15;
  camY=Math.max(yLo,Math.min(camY,yHi));
}

  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const v=T(tx,ty);if(!v)continue;
    const sx=tx*TILE-camX,sy=ty*TILE-camY;
    if(v===1)cx.drawImage(T_SIDE,sx,sy);
    else if(v===8)cx.drawImage(ty===GROUND?T_ROAD:T_ROAD2,sx,sy);
    else if(v===2)cx.drawImage(T_BRICK,sx,sy);
    else if(v===3)cx.drawImage(T_SCAF,sx,sy);
    else if(v===4){cx.drawImage(T_GIFT,sx,sy+Math.sin(frame*0.1+tx)*1);}
    else if(v===5)cx.drawImage(T_CRATE,sx,sy);
    else if(v===6)cx.drawImage(T_USED,sx,sy);
    else if(v===7)cx.drawImage(T_MAN,sx,sy);
  }
}
function drawSprite(s,x,y,flip,rot){
  const sx=Math.round(x-camX),sy=Math.round(y-camY);
  if(sx<-40||sx>VW+40)return;
  if(rot){
    cx.save();cx.translate(sx+s.width/2,sy+s.height/2);cx.rotate(rot);
    cx.drawImage(s,-s.width/2,-s.height/2);cx.restore();
  }else if(flip){
    cx.save();cx.translate(sx+s.width,sy);cx.scale(-1,1);cx.drawImage(s,0,0);cx.restore();
  }else cx.drawImage(s,sx,sy);
}
function drawPlayerAt(px,py,pose,dir,sc){
  sc=sc||1;
  let s=Z_IDLE;
  if(pose==='run')s=(Math.floor(frame/10)%2===0)?Z_RUN1:Z_RUN2;
  else if(pose==='jump')s=Z_JUMP;
  else if(pose==='throw')s=Z_THROW;
  const w=Math.round(18*sc), h=Math.round(30*sc);
  const fx=Math.round(px-4-(w-18)/2-camX), fy=Math.round(py+22-camY-h);
  if(fx<-60||fx>VW+60)return;
  if(dir<0){cx.save();cx.translate(fx+w,fy);cx.scale(-1,1);cx.drawImage(s,0,0,w,h);cx.restore();}
  else cx.drawImage(s,fx,fy,w,h);
}
function drawPlayer(){

  let pose='idle';

function drawEnts(){
  for(const e of ents){
    if(e.type==='pine'){drawSprite(PINE,e.x,e.y+Math.sin(frame*0.08+e.x)*1.5);continue;}
    if(e.type==='samosa'){drawSprite(SAMO,e.x,e.y+Math.sin(frame*0.08+e.x)*1.5);continue;}
    if(e.type==='chai'){drawSprite(CHAI,e.x,e.y+Math.sin(frame*0.08+e.x)*1.5);continue;}
    if(e.type==='mic'){drawSprite(MIC,e.x,e.y+Math.sin(frame*0.08+e.x)*1.5);continue;}
    const rot=e.dead?(e.rot||0):0;
    if(e.type==='aunt')drawSprite(frame%32<16?AUNT1:AUNT2,e.x,e.y+(e.oy||0),e.dir>0,rot);
    else if(e.type==='pig')drawSprite((e.mode==='sit'?(frame%40<20?PIG1:PIG1):(frame%10<5?PIG1:PIG2)),e.x,e.y,e.x+e.w/2<player.x,rot);
    else if(e.type==='rat')drawSprite(frame%16<8?RAT1:RAT2,e.x,e.y,e.dir>0,rot);
    if(e.dead){cx.fillStyle='#fff';const sx=e.x-camX,sy=e.y-camY;for(let i=0;i<3;i++)cx.fillRect(sx+6+Math.cos(e.bonkT*0.3+i*2.1)*8,sy-2+Math.sin(e.bonkT*0.3+i*2.1)*4,2,2);}
  }
  for(const pn of pans)drawSprite(PAN,pn.x-8,pn.y-2,pn.dir<0);

  cx.fillStyle='#7aa8cc';
  for(let i=0;i<24;i++){const bx=(i*37)%(VW+40)-20,bh=18+(i*29)%34,bw=14+(i*11)%14;cx.fillRect(bx,hor-bh,bw,bh);
    if(i%8===3){cx.fillRect(bx+bw/2-3,hor-bh-10,6,10);cx.fillRect(bx+bw/2-1,hor-bh-16,2,6);}}
  cx.drawImage(STATUE,VW-42,hor-56,24,56);
  const wh=Math.round(VH*0.18);
  cx.fillStyle='#2f74b8';cx.fillRect(0,hor,VW,wh);
  cx.fillStyle='#5a9ad8';
  for(let i=0;i<30;i++)cx.fillRect((i*53+frame)%VW,hor+3+(i*13)%(wh-6),6,1);
  const fxp=((frame*0.3)%(VW+60))-30, fy2=hor+7;
  cx.fillStyle='#fff';cx.fillRect(fxp,fy2,26,5);cx.fillStyle='#d02020';cx.fillRect(fxp+3,fy2-3,18,3);
  const py=hor+wh;
  cx.fillStyle='#9aa0aa';cx.fillRect(0,py,VW,VH-py);
  cx.fillStyle='#7c828c';for(let x=0;x<VW;x+=10)cx.fillRect(x,py,1,VH-py);
  cx.fillRect(0,py+8,VW,1);
  cx.fillStyle='#2a4a3a';
  cx.fillRect(0,py-14,VW,2);cx.fillRect(0,py-7,VW,1);
  for(let x=4;x<VW;x+=12)cx.fillRect(x,py-14,2,14);
  const sc2=2, base=Math.min(VH-12,py+Math.round((VH-py)*0.8));
  const order=[[VEER,12,19,'VEER'],[Z_IDLE,18,30,'ZARNA'],[ZOYA,12,22,'ZOYA'],[BRIJ,12,19,'BRIJ'],[SHAL,14,24,'SHALABH']];
  let tot=0;for(const o of order)tot+=o[1]*sc2+8;tot-=8;
  let x0=Math.round((VW-tot)/2);
  for(const [sp,w,h,label] of order){
    cx.drawImage(sp,x0,base-h*sc2,w*sc2,h*sc2);
    outText(cx,label,Math.round(x0+(w*sc2-textW(label))/2),base+3,'#fff');
    x0+=w*sc2+8;
  }
  for(let i=0;i<3;i++)cx.drawImage(HEART,Math.round(VW/2-34+i*28),hor-32+Math.sin(frame*0.08+i)*3);
  for(let i=0;i<30;i++){
    cx.fillStyle=['#ffd23f','#7dff7d','#7df','#ff5577','#fff'][i%5];
    cx.fillRect((i*53+frame*(1+i%3)*0.4)%VW,(i*37+frame*(0.5+i%2))%VH,2,3);
  }
  bigTextC('ONE OF A KIND!',6,2,'#ffd23f','#902020');
  if(t>280||(anyPressEdge&&t>60)){state='SCORE';sceneT=0;
    if(score>best){best=score;localStorage.setItem('zarnaBest',best);}
  }
}
function drawScore(){
  cx.fillStyle='#1a1028';cx.fillRect(0,0,VW,VH);
  bigTextC('FAMILY SAVED.',VH*0.15,2,'#7dff7d','#000');
  bigTextC('MOTHER-IN-LAW',VH*0.15+20,1,'#ff9db0','#000');
  bigTextC('STILL DISAPPOINTED.',VH*0.15+30,1,'#ff9db0','#000');
  const cyy=VH*0.15+50;
  centerText(cx,'SCORE: '+score,cyy,'#ffd23f');
  centerText(cx,'PINEAPPLES: '+pineCount,cyy+12,'#ffd23f');
  centerText(cx,'TIME: '+Math.floor(levelTime/60)+'S',cyy+24,'#8fd4ff');
  centerText(cx,'BEST: '+best,cyy+36,'#7df');
  if(score>=best&&score>0)centerText(cx,'NEW BEST! AUNTIES ARE SEETHING.',cyy+48,'#7dff7d');
  const bw=68,bh=15,bx=Math.round((VW-bw)/2),by=Math.min(VH-20,Math.round(VH*0.15)+50+62);
  cx.fillStyle='#1a4a1a';cx.fillRect(bx-2,by-2,bw+4,bh+4);
  cx.fillStyle=frame%60<40?'#7dff7d':'#5cd45c';cx.fillRect(bx,by,bw,bh);
  outText(cx,'PLAY AGAIN',bx+Math.round((bw-textW('PLAY AGAIN'))/2),by+5,'#0c2a0c','#c8ffc8');
  if(anyPressEdge&&sceneT>50){state='INTRO';sceneT=0;rescued=false;finishBonus=false;
    introFam={fx:Math.min(200,VW-64),carried:false};setTrack(TR_MAIN);}
}

// ============ MAIN LOOP ============
resetRun(-1);
state='TITLE';

function sceneUpdateFX(){
  for(const o of parts){o.t++;o.x+=o.vx;o.y+=o.vy;o.vy+=0.03;}
  parts=parts.filter(o=>o.t<o.life);
  for(const o of pops)o.t++;
  pops=pops.filter(o=>o.t<50);
}
(function(){
  let last='TITLE';
  function loop(){
    requestAnimationFrame(loop);
    if(state!==last){sceneT=0;last=state;}
    frame++;sceneT++;
    if(fitKey()!==lastFit)fit();
    if(AC&&!curTrack&&state==='TITLE')setTrack(TR_TITLE);
    if(state==='TITLE')drawTitle();
    else if(state==='INTRO')drawIntro();
    else if(state==='PLAY'){
      updatePlay();
      drawBG();drawWires();drawTiles();drawProps();drawEnts();drawPlayer();drawFX();drawHUD();
    }
    else if(state==='GAMEOVER'){drawGameOver();}
    else if(state==='RESCUE'){sceneUpdateFX();drawRescue();}
    else if(state==='PHOTO')drawPhoto();
    else if(state==='SCORE')drawScore();
    anyPressEdge=false;jumpPressed=false;firePressed=false;
  }
  loop();
})();
</script>
</body>
</html>
