const TILE=16, BASE_W=288, BASE_H=144;

// ============ ADAPTIVE VIEWPORT (self-healing) ============
let lastFit='';
function fitKey(){
  const v=window.visualViewport;
  return innerWidth+'x'+innerHeight+(v?('|'+(v.width|0)+','+(v.height|0)+','+v.scale):'');
}
function fit(){
  lastFit=fitKey();
  const v=window.visualViewport;
  const w=v?Math.round(v.width):innerWidth, h=v?Math.round(v.height):innerHeight;
  ZOOM=Math.max(1,Math.min(Math.floor(w/192),Math.floor(h/144)));
  while(ZOOM>1&&(w/ZOOM<160||h/ZOOM<120))ZOOM--;
  VW=Math.ceil(w/ZOOM); VH=Math.ceil(h/ZOOM);
  cv.width=VW; cv.height=VH;
  cv.style.width=(VW*ZOOM)+'px'; cv.style.height=(VH*ZOOM)+'px';
  cx.imageSmoothingEnabled=false;
}
fit();
addEventListener('resize',fit);
addEventListener('pageshow',fit);
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit);}
addEventListener('gesturestart',e=>e.preventDefault());
addEventListener('gesturechange',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});

// ============ INPUT ============
const keys={};
let anyPress=false, anyPressEdge=false;
addEventListener('keydown',e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  if(!keys[e.code]){if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW')jumpPressed=true; if(e.code==='KeyX'||e.code==='KeyF')firePressed=true; anyPressEdge=true;}
  keys[e.code]=true; anyPress=true; initAudio();
});
addEventListener('keyup',e=>{keys[e.code]=false;});
let jumpPressed=false, firePressed=false, jumpHeld=false;
// touch state
const touches={}; // id -> {sx,sy,x,y,zone}
let joyId=null, joyBase=null, joyNub=null, joyDX=0;
let jumpBtnId=null, fireBtnId=null;
function btnRects(){
  const jr=VH-30, jx=VW-32, fx=VW-72;
  return {jump:{x:jx,y:jr,r:20},fire:{x:fx,y:jr,r:15}};
}
function tpos(t){const r=cv.getBoundingClientRect();return{x:(t.clientX-r.left)/ZOOM,y:(t.clientY-r.top)/ZOOM};}
cv.addEventListener('touchstart',e=>{
  e.preventDefault(); initAudio(); anyPress=true; anyPressEdge=true;
  for(const t of e.changedTouches){
    const p=tpos(t), b=btnRects();
    if(Math.hypot(p.x-b.jump.x,p.y-b.jump.y)<b.jump.r+8){jumpBtnId=t.identifier;jumpPressed=true;jumpHeld=true;continue;}
    if(Math.hypot(p.x-b.fire.x,p.y-b.fire.y)<b.fire.r+8){fireBtnId=t.identifier;firePressed=true;continue;}
    if(p.x<VW/2){ if(joyId===null){joyId=t.identifier;joyBase={x:p.x,y:p.y};joyNub={x:p.x,y:p.y};joyDX=0;} }
    else {jumpPressed=true;jumpHeld=true;if(jumpBtnId===null)jumpBtnId=t.identifier;} // right-half tap = jump fallback
  }
},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p=tpos(t);
    if(t.identifier===joyId){
      const dx=p.x-joyBase.x;
      joyNub={x:joyBase.x+Math.max(-16,Math.min(16,dx)),y:joyBase.y+Math.max(-16,Math.min(16,p.y-joyBase.y))};
      joyDX=Math.abs(dx)<4?0:Math.max(-1,Math.min(1,dx/16));
    }
  }
},{passive:false});
function endTouch(e){
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier===joyId){joyId=null;joyBase=null;joyNub=null;joyDX=0;}
    if(t.identifier===jumpBtnId){jumpBtnId=null;jumpHeld=false;}
    if(t.identifier===fireBtnId){fireBtnId=null;}
  }
}
cv.addEventListener('touchend',endTouch,{passive:false});
cv.addEventListener('touchcancel',endTouch,{passive:false});
cv.addEventListener('mousedown',()=>{initAudio();anyPress=true;anyPressEdge=true;});
function inputDir(){
  let d=0;
  if(keys['ArrowLeft']||keys['KeyA'])d-=1;
  if(keys['ArrowRight']||keys['KeyD'])d+=1;
  if(joyDX)d=joyDX;
  return d;
}
function inputJumpHeld(){return jumpHeld||keys['Space']||keys['ArrowUp']||keys['KeyW'];}

function drawText(g,s,x,y,col){
  s=(''+s).toUpperCase();
  g.fillStyle=col||'#fff';
  let px=x;
  for(const ch of s){
    const m=FONT[ch]||FONT['?'];
    for(let i=0;i<15;i++)if(m[i]==='1')g.fillRect(px+(i%3),y+(i/3|0),1,1);
    px+=4;
  }
  return px-x;
}
function textW(s){return s.length*4-1;}
function outText(g,s,x,y,col,out){
  for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)if(dx||dy)drawText(g,s,x+dx,y+dy,out||'#1a1028');
  drawText(g,s,x,y,col);
}
function centerText(g,s,y,col,out){outText(g,s,Math.round((VW-textW(s))/2),y,col,out);}

// ============ SPRITE ENGINE ============
function spr(rows,pal){
  const w=rows[0].length,h=rows.length;
  const o=document.createElement('canvas');o.width=w;o.height=h;
  const g=o.getContext('2d');
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const ch=rows[y][x];
    if(ch==='.'||ch===' ')continue;
    g.fillStyle=pal[ch]||'#f0f';g.fillRect(x,y,1,1);
  }
  return o;
}
function flipSpr(s){
  const o=document.createElement('canvas');o.width=s.width;o.height=s.height;
  const g=o.getContext('2d');g.translate(s.width,0);g.scale(-1,1);g.drawImage(s,0,0);
  return o;
}

// ============ AUDIO ============
let AC=null, musicTimer=null, curTrack=null, nextNoteT=0, stepIdx=0;
let laughTimer=null;
function initAudio(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    musicTimer=setInterval(schedule,30);
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(AC&&document.visibilityState==='visible'&&AC.state==='suspended')AC.resume();});
// note name -> freq
function nf(n){ // e.g. 'C4'
  if(!n)return 0;
  const NAMES={C:0,'C#':1,D:2,'D#':3,E:4,F:5,'F#':6,G:7,'G#':8,A:9,'A#':10,B:11};
  const m=n.match(/^([A-G]#?)(\d)$/); if(!m)return 0;
  return 440*Math.pow(2,(NAMES[m[1]]+(+m[2]-4)*12-9)/12);
}
function tone(t,f,dur,type,vol,slide){
  if(!AC||!f)return;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+dur);
  g.gain.setValueAtTime(vol||0.08,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g);g.connect(AC.destination);
  o.start(t);o.stop(t+dur+0.02);
}
let noiseBuf=null;
function noise(t,dur,vol,hp){
  if(!AC)return;
  if(!noiseBuf){
    noiseBuf=AC.createBuffer(1,AC.sampleRate*0.5,AC.sampleRate);
    const d=noiseBuf.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  const s=AC.createBufferSource(),g=AC.createGain(),f=AC.createBiquadFilter();
  s.buffer=noiseBuf;s.loop=true;
  f.type=hp?'highpass':'bandpass';f.frequency.value=hp||1200;f.Q.value=1;
  g.gain.setValueAtTime(vol||0.06,t);
  g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  s.connect(f);f.connect(g);g.connect(AC.destination);
  s.start(t);s.stop(t+dur+0.02);
}

// tile collision helpers
function rectVsTiles(px,py,w,h){ // returns overlapping solid
  const x0=Math.floor(px/TILE),x1=Math.floor((px+w-1)/TILE),y0=Math.floor(py/TILE),y1=Math.floor((py+h-1)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)if(SOLID(T(tx,ty)))return{tx,ty};
  return null;
}
function moveEntity(e){ // horizontal+vertical with tile collision; returns {hitX,hitY,onGround}
  const res={hitX:false,onGround:false,headTile:null};
  e.x+=e.vx;
  let c=rectVsTiles(e.x,e.y,e.w,e.h);
  if(c){if(e.vx>0)e.x=c.tx*TILE-e.w-0.01;else if(e.vx<0)e.x=(c.tx+1)*TILE+0.01;res.hitX=true;e.vx=0;}
  const wasBottom=e.y+e.h;
  e.y+=e.vy;
  c=rectVsTiles(e.x,e.y,e.w,e.h);
  if(c){
    if(e.vy>0){e.y=c.ty*TILE-e.h-0.01;res.onGround=true;}
    else if(e.vy<0){e.y=(c.ty+1)*TILE+0.01;res.headTile=c;}
    e.vy=0;
  }
  // one-way scaffold
  if(e.vy>=0){
    const ty=Math.floor((e.y+e.h)/TILE);
    const x0=Math.floor((e.x+1)/TILE),x1=Math.floor((e.x+e.w-2)/TILE);
    for(let tx=x0;tx<=x1;tx++){
      if(T(tx,ty)===3){
        const top=ty*TILE;
        if(wasBottom<=top+3&&e.y+e.h>=top){e.y=top-e.h-0.01;e.vy=0;res.onGround=true;}
      }
    }
  }
  return res;
}
function bumpTile(tx,ty){ // player head hit tile
  const v=T(tx,ty);
  if(v===4){ // gift box
    setT(tx,ty,6);SFX.bump();SFX.ding();
    const k=tx+','+ty;giftBoxes[k]=1;
    collectPine();addPop(tx*TILE,ty*TILE-10,'+50','#ffd23f');
    puff(tx*TILE+8,ty*TILE-4,'#ffd23f');
  }else if(v===5){
    setT(tx,ty,0);SFX.crate();puff(tx*TILE+8,ty*TILE+8,'#b57e3c',8);
    if(Math.random()<0.6){collectPine();addPop(tx*TILE,ty*TILE-6,'+50','#ffd23f');}
    score+=25;
  }else if(v===2||v===1){SFX.bump();}
}
// ============ UPDATE: PLAY ============
function updatePlay(){
  levelTime++;
  const p=player;
  const spd=(chaiT>0?2.1:1.4)*(micT>0?1.15:1);
  const d=inputDir();
  if(d){p.vx+=(d*spd-p.vx)*0.3;p.dir=d>0?1:-1;}
  else p.vx*=0.7;
  if(Math.abs(p.vx)<0.05)p.vx=0;
  // jump buffer & coyote
  if(jumpPressed){p.jbuf=8;jumpPressed=false;}
  else if(p.jbuf>0)p.jbuf--;
  if(p.grounded)p.coyote=7;else if(p.coyote>0)p.coyote--;
  if(p.jbuf>0&&p.coyote>0){p.vy=-4.7;p.coyote=0;p.jbuf=0;p.grounded=false;SFX.jump();}
  if(!inputJumpHeld()&&p.vy<-1.8)p.vy=-1.8; // variable height
  p.vy=Math.min(p.vy+0.24,5);
  const r=moveEntity(p);
  p.grounded=r.onGround;
  if(r.headTile&&p.vy===0)bumpTile(r.headTile.tx,r.headTile.ty);
  if(p.grounded){
    p.anim+=Math.abs(p.vx)*0.35;
    // record safe spot (not over manhole/road-with-close-taxi/gap edge)
    const txc=Math.floor((p.x+p.w/2)/TILE);
    if(T(txc,GROUND)===1&&frame%20===0){lastSafe={x:p.x,y:p.y};}
  }
  // manhole hazard: feet in manhole tile
  const ftx=Math.floor((p.x+p.w/2)/TILE), fty=Math.floor((p.y+p.h+1)/TILE);
  if(T(ftx,fty)===7&&p.y+p.h>GROUND*TILE+2){hurtPlayer();p.y=GROUND*TILE-p.h-2;p.vy=-3.5;}
  // fell in gap
  if(p.y>LH*TILE+20){hurtPlayer();if(hearts>0){p.x=lastSafe.x;p.y=lastSafe.y;p.vx=0;p.vy=0;invT=90;}}
  // fire pan
  if(firePressed){
    firePressed=false;
    if(p.throwT<=0){
      p.throwT=18;SFX.throwSfx();
      pans.push({x:p.x+p.w/2,y:p.y+6,vx:p.dir*2.6+p.vx*0.4,vy:-2.2,rot:0});
    }
  }
  if(p.throwT>0)p.throwT--;
  if(invT>0)invT--;
  if(micT>0){micT--;if(micT===0)setTrack(TR_MAIN);if(micT%22===0)SFX.laugh();}
  if(chaiT>0){chaiT--;if(chaiT%3===0)parts.push({x:p.x+(p.dir<0?p.w:0),y:p.y+14,vx:-p.dir*0.5,vy:-0.6,t:0,life:18,col:'#e8e8f4'});}
  // checkpoints
  checkpoints.forEach((c,i)=>{if(!c.used&&p.x+p.w>c.x){c.used=true;lastCP=i;SFX.powerup();addPop(c.x,GROUND*TILE-40,'CHECKPOINT!','#7dff7d');}});
  // MIL swoops
  milSwoops.forEach(s=>{
    if(!s.done&&p.x>s.x){s.done=true;SFX.cackle();
      mil={x:camX-30,y:24,t:0,drops:3,line:s.line};
      milBubble={text:s.line,t:0};
    }
  });
  if(mil){
    mil.t++;mil.x+=1.7;mil.y=24+Math.sin(mil.t*0.05)*8;
    if(mil.drops>0&&mil.t%50===30&&mil.x>camX+20&&mil.x<camX+VW-20){mil.drops--;rotis.push({x:mil.x+8,y:mil.y+16,vx:0.3,vy:0.5,rot:0});SFX.sizzle();}
    if(mil.x>camX+VW+60)mil=null;
  }
  if(milBubble){milBubble.t++;if(milBubble.t>160)milBubble=null;}
  // pans
  for(const pn of pans){
    pn.x+=pn.vx;pn.vy+=0.13;pn.y+=pn.vy;pn.rot+=0.35;
    if(rectVsTiles(pn.x-3,pn.y-3,6,6)){pn.gone=true;SFX.clang();puff(pn.x,pn.y,'#8a929e',4);}
  }
  pans=pans.filter(pn=>!pn.gone&&pn.y<LH*TILE+30&&pn.x>camX-40&&pn.x<camX+VW+60);
  // rotis
  for(const rt of rotis){
    rt.x+=rt.vx;rt.vy=Math.min(rt.vy+0.08,2.2);rt.y+=rt.vy;rt.rot+=0.2;
    if(Math.abs(rt.x-(p.x+p.w/2))<7&&Math.abs(rt.y-(p.y+p.h/2))<11){rt.gone=true;hurtPlayer();}
    if(rt.y>GROUND*TILE-4){rt.gone=true;puff(rt.x,GROUND*TILE-2,'#8a5a28',4);}
  }
  rotis=rotis.filter(rt=>!rt.gone);
  // taxis
  for(const tx of taxis){
    tx.x-=1.15;
    if(tx.x<(tx.road[0]-4)*TILE){tx.x=(tx.road[1]+3)*TILE;tx.horned=false;}
    const ty=GROUND*TILE-14;
    if(!tx.horned&&Math.abs(tx.x-p.x)<110&&Math.abs(p.y-ty)<40){tx.horned=true;SFX.horn();}
    if(p.x+p.w>tx.x+3&&p.x<tx.x+tx.w-3&&p.y+p.h>ty+2&&p.y<ty+tx.h){
      if(p.vy>0.5&&p.y+p.h<ty+9){p.vy=-4;SFX.stomp();} // bounce off roof
      else hurtPlayer();
    }
  }
  // entities
  for(const e of ents){
    if(e.dead){ // dizzy spiral away
      e.bonkT++;e.x+=e.vx;e.y+=e.vy;e.vy+=0.12;e.rot=(e.rot||0)+0.3;
      if(e.bonkT>90)e.gone=true;
      continue;
    }
    const dx=(p.x+p.w/2)-(e.x+e.w/2), adx=Math.abs(dx), near=adx<130;
    if(e.type==='aunt'){
      if(micT>0){e.dir=dx>0?-1:1;e.x+=e.dir*1.4;} // flee!
      else{
        if(near)e.dir=dx>0?1:-1;
        e.vx=e.dir*0.45;e.vy=Math.min(e.vy+0.24,5);
        const er=moveEntity(e);
        if(er.hitX)e.dir*=-1;
        // don't walk off ledges
        const ahead=Math.floor((e.x+e.w/2+e.dir*10)/TILE);
        if(er.onGround&&!SOLID(T(ahead,GROUND))&&T(ahead,GROUND)!==3)e.dir*=-1;
      }
      if(near&&frame%150===((e.x|0)%150))SFX.haihai();
    }else if(e.type==='pig'){
      if(micT>0){e.y-=1.2;e.x+=(dx>0?-1:1)*0.8;}
      else if(e.mode==='sit'){
        if(adx<90&&p.y>e.y){e.mode='dive';e.diveT=0;SFX.flap();}
      }else if(e.mode==='dive'){
        e.diveT++;
        e.x+=(dx>0?1:-1)*0.9;
        e.y+=Math.sin(Math.min(e.diveT*0.04,1.4))*1.6;
        if(e.y>GROUND*TILE-24||e.diveT>120){e.mode='rise';}
      }else{ e.y-=0.8; if(e.y<=e.homeY){e.y=e.homeY;e.mode='sit';} }
    }else if(e.type==='rat'){
      if(micT>0){e.dir=dx>0?-1:1;}
      else if(near)e.dir=dx>0?1:-1;
      e.vx=e.dir*(near?1.5:0.8);e.vy=Math.min(e.vy+0.24,5);
      const er=moveEntity(e);
      if(er.hitX)e.dir*=-1;
      const ahead=Math.floor((e.x+e.w/2+e.dir*10)/TILE);
      if(er.onGround&&!SOLID(T(ahead,GROUND))&&T(ahead,GROUND)!==3)e.dir*=-1;
      if(near&&frame%120===((e.x|0)%120))SFX.squeak();
    }else if(e.type==='uncle'){
      if(micT<=0){e.cool--;
        if(e.cool<=0&&adx<130){e.cool=170;waves.push({x:e.x+e.w/2,y:GROUND*TILE,dir:dx>0?1:-1,t:0});}
      }
    }
    // player vs enemy
    if(e.type!=='pine'&&e.type!=='chai'&&e.type!=='samosa'&&e.type!=='mic'){
      const ey=e.y+(e.oy||0);
      if(p.x+p.w>e.x+2&&p.x<e.x+e.w-2&&p.y+p.h>ey+2&&p.y<ey+e.h-2){
        if(micT>0)bonk(e,'pan');
        else if(p.vy>0.5&&p.y+p.h<ey+e.h*0.55&&e.type!=='rat'){bonk(e,'stomp');p.vy=-3.6;}
        else if(e.type==='rat'&&p.vy>0.5&&p.y+p.h<ey+5){bonk(e,'stomp');p.vy=-3.6;}
        else hurtPlayer();
      }
      // pans vs enemy
      for(const pn of pans){
        if(!pn.gone&&pn.x>e.x-4&&pn.x<e.x+e.w+4&&pn.y>ey-4&&pn.y<ey+e.h+4){pn.gone=true;bonk(e,'pan');}
      }
    }else{
      // pickups
      const ey=e.y;
      if(p.x+p.w>e.x-2&&p.x<e.x+e.w+2&&p.y+p.h>ey-4&&p.y<ey+e.h+4){
        e.gone=true;
        if(e.type==='pine'){collectPine();addPop(e.x,e.y-8,'+50','#ffd23f');}
        else if(e.type==='samosa'){gainHeart();SFX.powerup();addPop(e.x,e.y-8,'SAMOSA!','#d99a3c');}
        else if(e.type==='chai'){chaiT=480;SFX.powerup();addPop(e.x,e.y-8,'CHAI RUSH!','#e8b090');}
        else if(e.type==='mic'){micT=600;setTrack(TR_MIC);SFX.powerup();addPop(e.x,e.y-10,'COMEDY SPECIAL!','#7df');}
      }
    }
  }
  ents=ents.filter(e=>!e.gone);
  // waves
  for(const w of waves){
    w.t++;w.x+=w.dir*0.75;
    if(micT<=0&&Math.abs(w.x-(p.x+p.w/2))<8&&p.y+p.h>GROUND*TILE-14)hurtPlayer();
  }
  waves=waves.filter(w=>w.t<220);
  // popups & particles
  for(const o of pops)o.t++;
  pops=pops.filter(o=>o.t<50);
  for(const o of parts){o.t++;o.x+=o.vx;o.y+=o.vy;o.vy+=0.03;}
  parts=parts.filter(o=>o.t<o.life);
  // end of level
  if(p.x+p.w>END_X){state='RESCUE';sceneT=0;mil=null;milBubble=null;rotis=[];setTrack(TR_WIN);SFX.cheer();}
  // camera
  camX=Math.max(0,Math.min(p.x-VW*0.38,LW*TILE-VW));
  const yLo=Math.min(0,LH*TILE-VH), yHi=Math.max(yLo,LH*TILE-VH);
  const targY=Math.max(yLo,Math.min(p.y-VH*0.55,yHi));
  camY+=(targY-camY)*0.15;
  camY=Math.max(yLo,Math.min(camY,yHi));
}

function bigText(s,x,y,scale,col,out){
  const w=textW(s)+2,h=7;
  const o=document.createElement('canvas');o.width=w+2;o.height=h+2;
  const g=o.getContext('2d');
  for(let dx=0;dx<=2;dx++)for(let dy=0;dy<=2;dy++)if(dx!==1||dy!==1)drawText(g,s,dx,dy,out||'#1a1028');
  drawText(g,s,1,1,col);
  cx.drawImage(o,0,0,o.width,o.height,x,y,o.width*scale,o.height*scale);
  return o.width*scale;
}
function bigTextC(s,y,scale,col,out){while(scale>1&&(textW(s)+2)*scale>VW-4)scale--;bigText(s,Math.round((VW-(textW(s)+2)*scale)/2),y,scale,col,out);}

    if(!bodega){
      for(let wy=gy-bh+6;wy<gy-10;wy+=12)for(let wx=bx+5;wx<bx+bw-6;wx+=12){cx.fillRect(wx,wy,6,8);}
      cx.fillStyle='#5a3a24';cx.fillRect(bx+bw/2-6,gy-14,12,14); // stoop door
      cx.fillStyle='#c8b8a8';cx.fillRect(bx-2,gy-bh,bw+4,3); // cornice
    }else{
      cx.fillStyle='#ffd23f';cx.fillRect(bx+2,gy-bh+4,bw-4,8);

function drawWires(){

function drawTiles(){
  const x0=Math.floor(camX/TILE),x1=Math.ceil((camX+VW)/TILE);
  const y0=Math.floor(camY/TILE),y1=Math.ceil((camY+VH)/TILE);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){
    const v=T(tx,ty);if(!v)continue;
    const sx=tx*TILE-camX,sy=ty*TILE-camY;
    if(v===1)cx.drawImage(T_SIDE,sx,sy);
    else if(v===8)cx.drawImage(ty===GROUND?T_ROAD:T_ROAD2,sx,sy);
    else if(v===2)cx.drawImage(T_BRICK,sx,sy);
    else if(v===3)cx.drawImage(T_SCAF,sx,sy);
    else if(v===4){cx.drawImage(T_GIFT,sx,sy+Math.sin(frame*0.1+tx)*1);}
    else if(v===5)cx.drawImage(T_CRATE,sx,sy);
    else if(v===6)cx.drawImage(T_USED,sx,sy);
    else if(v===7)cx.drawImage(T_MAN,sx,sy);
  }
}
function drawSprite(s,x,y,flip,rot){
  const sx=Math.round(x-camX),sy=Math.round(y-camY);
  if(sx<-40||sx>VW+40)return;
  if(rot){
    cx.save();cx.translate(sx+s.width/2,sy+s.height/2);cx.rotate(rot);
    cx.drawImage(s,-s.width/2,-s.height/2);cx.restore();
  }else if(flip){
    cx.save();cx.translate(sx+s.width,sy);cx.scale(-1,1);cx.drawImage(s,0,0);cx.restore();
  }else cx.drawImage(s,sx,sy);
}
function drawPlayerAt(px,py,pose,dir){
  let s=Z_IDLE;
  if(pose==='run')s=(Math.floor(player?player.anim:0)%2===0)?Z_RUN1:Z_RUN2;
  else if(pose==='jump')s=Z_JUMP;
  else if(pose==='throw')s=Z_THROW;
  drawSprite(s,px-1,py-2,dir<0);
}
function drawPlayer(){
  const p=player;
  if(invT>0&&(frame%6<3))return;
  let pose='idle';
  if(p.throwT>10)pose='throw';
  else if(!p.grounded)pose='jump';
  else if(Math.abs(p.vx)>0.2)pose='run';
  if(micT>0){ // sparkle aura
    cx.fillStyle='rgba(125,220,255,0.5)';
    for(let i=0;i<3;i++)cx.fillRect(p.x-camX+((frame*7+i*40)%18)-4,p.y-camY+((frame*5+i*60)%24)-2,2,2);
  }
  drawPlayerAt(p.x,p.y,pose,p.dir);
}
function drawEnts(){
  for(const e of ents){
    if(e.type==='pine'){drawSprite(PINE,e.x,e.y+Math.sin(frame*0.08+e.x)*1.5);continue;}
    if(e.type==='samosa'){drawSprite(SAMO,e.x,e.y+Math.sin(frame*0.08+e.x)*1.5);continue;}
    if(e.type==='chai'){drawSprite(CHAI,e.x,e.y+Math.sin(frame*0.08+e.x)*1.5);continue;}
    if(e.type==='mic'){drawSprite(MIC,e.x,e.y+Math.sin(frame*0.08+e.x)*1.5);continue;}
    const rot=e.dead?(e.rot||0):0;
    if(e.type==='aunt')drawSprite(frame%24<12?AUNT1:AUNT2,e.x,e.y+(e.oy||0),e.dir>0,rot);
    else if(e.type==='pig')drawSprite((e.mode==='sit'?(frame%40<20?PIG1:PIG1):(frame%10<5?PIG1:PIG2)),e.x,e.y,e.x+e.w/2<player.x,rot);
    else if(e.type==='rat')drawSprite(frame%12<6?RAT1:RAT2,e.x,e.y,e.dir>0,rot);
    else if(e.type==='uncle'){drawSprite(UNCLE,e.x,e.y+(e.oy||0),player.x<e.x,rot);}
    if(e.dead){cx.fillStyle='#fff';const sx=e.x-camX,sy=e.y-camY;for(let i=0;i<3;i++)cx.fillRect(sx+6+Math.cos(e.bonkT*0.3+i*2.1)*8,sy-2+Math.sin(e.bonkT*0.3+i*2.1)*4,2,2);}
  }
  for(const w of waves){
    const sx=w.x-camX, gy=GROUND*TILE-camY;
    cx.strokeStyle='rgba(120,80,160,'+(0.9-w.t/260)+')';
    cx.beginPath();cx.arc(sx,gy,7+Math.sin(w.t*0.2)*2,Math.PI,0);cx.stroke();
    cx.beginPath();cx.arc(sx,gy,11+Math.sin(w.t*0.2+1)*2,Math.PI,0);cx.stroke();
  }
  for(const pn of pans)drawSprite(PAN,pn.x-4,pn.y-4,false,pn.rot);
  for(const rt of rotis)drawSprite(ROTI,rt.x-3,rt.y-3,false,rt.rot);
  for(const tx of taxis){
    const sx=tx.x-camX;if(sx<-40||sx>VW+40)continue;
    drawSprite(TAXI,tx.x-1,GROUND*TILE-14);
  }
  if(mil)drawSprite(frame%16<8?MIL1:MIL2,mil.x,mil.y);
}

      cx.beginPath();cx.arc(joyNub.x,joyNub.y,7,0,7);cx.fill();
    }
    const b=btnRects();
    cx.fillStyle='#7dff7d';cx.beginPath();cx.arc(b.jump.x,b.jump.y,b.jump.r,0,7);cx.fill();
    cx.fillStyle='#ffd23f';cx.beginPath();cx.arc(b.fire.x,b.fire.y,b.fire.r,0,7);cx.fill();
    cx.globalAlpha=0.9;
    outText(cx,'JUMP',b.jump.x-textW('JUMP')/2,b.jump.y-2,'#1a4a1a','#fff0');
    outText(cx,'PAN',b.fire.x-textW('PAN')/2,b.fire.y-2,'#6a4a00','#fff0');
    cx.globalAlpha=1;
  }
}

// ============ SCENES ============
let introFam=null;
function drawTitle(){
  camX=0;camY=LH*TILE-VH;
  drawBG();drawWires();drawTiles();drawProps();
  // big Zarna
  const zs=3, zx=Math.round(VW*0.72), zy=VH-22-22*zs;
  cx.save();cx.imageSmoothingEnabled=false;
  cx.drawImage(Z_IDLE,zx,zy,12*zs,22*zs);
  cx.drawImage(PAN,zx-14,zy+30,16,16);
  cx.restore();
  const ty=Math.max(12,VH*0.14);
  bigTextC('RUN, ZARNA, RUN!',ty,3,'#ffd23f','#902020');
  bigTextC('A NYC RESCUE ROMP',ty+26,1,'#fff','#1a1028');
  if(frame%60<40)bigTextC('ontouchstart' in window?'TAP TO START':'PRESS SPACE TO START',VH-34,1,'#fff','#1a1028');
  bigTextC('BEST: '+best,VH-16,1,'#8fd4ff','#1a1028');
  if(anyPressEdge&&frame>30){state='INTRO';sceneT=0;introFam={mx:-60,fx:Math.min(196,VW-56),carried:false};setTrack(TR_MAIN);}
}
function drawIntro(){
  camX=0;camY=LH*TILE-VH;
  drawBG();drawWires();drawTiles();drawProps();
  const gy=GROUND*TILE-camY;
  const t=sceneT;
  // Zarna
  drawPlayerAt(40,GROUND*TILE-24,'idle',1);
  // family
  const f=introFam;
  let fy=gy;
  if(!f.carried){
    cx.drawImage(HUSB,f.fx,fy-13);cx.drawImage(KID1,f.fx+12,fy-9);cx.drawImage(KID2,f.fx+21,fy-9);cx.drawImage(KID3,f.fx+30,fy-9);
  }
  // MIL flies in, swoops down, grabs, carries off
  let milX=-60,milY=20;
  if(t>60&&t<=160){milX=Math.min(-60+(t-60)*2.6,f.fx-14);milY=20+Math.sin(t*0.1)*4;}
  else if(t>160&&t<=200){milX=f.fx-14;milY=20+(gy-72-20)*(t-160)/40;}
  if(t>200&&!f.carried){f.carried=true;SFX.cackle();}
  if(f.carried){
    milX=f.fx-14+(t-200)*2.4;milY=Math.max(20,(gy-72)-(t-200)*1.2);
    cx.drawImage(HUSB,milX+4,milY+18);cx.drawImage(KID1,milX+14,milY+20);cx.drawImage(KID2,milX+22,milY+20);cx.drawImage(KID3,milX+30,milY+20);
  }
  if(t>60)cx.drawImage(frame%16<8?MIL1:MIL2,milX,milY);
  // captions
  if(t<100)centerText(cx,'ZARNA AND FAMILY. HAPPY. FED. MOSTLY.',14,'#fff');
  else if(t<200){
    const msg='MY SON DESERVED BETTER!';
    const w=textW(msg)+10,bx=Math.max(4,Math.min(VW-w-4,milX-20));
    cx.fillStyle='#fff';cx.fillRect(bx,8,w,13);cx.fillStyle='#1a1028';cx.fillRect(bx+10,21,4,3);
    drawText(cx,msg,bx+5,12,'#1a1028');
    if(t===120)SFX.cackle();
  }else if(t<340){
    centerText(cx,'THE MOTHER-IN-LAW TOOK THEM!',14,'#fff');
    if(f.carried){const m2='HELP, MOM!';const bx2=Math.min(VW-textW(m2)-14,milX+10);
      if(bx2>0){cx.fillStyle='#fff';cx.fillRect(bx2,28,textW(m2)+8,12);drawText(cx,m2,bx2+4,31,'#1a1028');}}
  }else{
    bigTextC('RUN, ZARNA, RUN!',VH/2-14,2,'#ffd23f','#902020');
  }
  centerText(cx,'TAP TO SKIP',VH-10,'#c8ecff');
  if(t>420||(anyPressEdge&&t>20)){state='PLAY';resetRun(-1);setTrack(TR_MAIN);}
}
function drawGameOver(){
  drawBG();drawWires();drawTiles();drawProps();drawEnts();drawFX();
  cx.fillStyle='rgba(20,10,30,0.72)';cx.fillRect(0,0,VW,VH);
  bigTextC('BONKED!',VH*0.28,3,'#ff5566','#1a1028');
  centerText(cx,'THE AUNTIES GOT YOU. SO EMBARRASSING.',VH*0.28+30,'#fff');
  centerText(cx,'SCORE: '+score,VH*0.28+42,'#ffd23f');
  if(frame%60<40)centerText(cx,'TAP TO CONTINUE FROM '+(lastCP>=0?'PRETZEL CART':'START'),VH*0.28+58,'#7dff7d');
  if(anyPressEdge&&sceneT>30){state='PLAY';resetRun(lastCP);setTrack(TR_MAIN);}
}
let rescued=false, finishBonus=false;
function drawRescue(){
  const t=sceneT;
  camX=Math.min(END_X-VW*0.3,LW*TILE-VW);camY=LH*TILE-VH;
  drawBG();drawWires();drawTiles();drawProps();drawFX();
  const gy=GROUND*TILE-camY, doorX=185*TILE-22-camX;
  if(!finishBonus){finishBonus=true;score+=1000;addPop(player.x,player.y-20,'+1000 RESCUE!','#7dff7d');}
  drawPlayerAt(player.x,player.y,'idle',1);
  // MIL flees up-right
  if(t<160){
    const mx=doorX+camX-10+t*1.4, my=40-t*0.5;
    drawSprite(frame%16<8?MIL1:MIL2,mx,Math.max(-30,my));
    if(t===20)SFX.cackle();
    if(t<140){const msg="THIS ISN'T OVER, BETA!";const w=textW(msg)+10,bx=Math.max(4,Math.min(VW-w-4,mx-camX-30));
      cx.fillStyle='#fff';cx.fillRect(bx,8,w,13);drawText(cx,msg,bx+5,12,'#1a1028');}
  }
  // family walks out
  if(t>120){
    if(t===150)SFX.cheer();
    const prog=Math.min((t-120)*0.5,40);
    cx.drawImage(HUSB,doorX-8-prog,gy-13);
    cx.drawImage(KID1,doorX+2-prog*0.85,gy-9);
    cx.drawImage(KID2,doorX+10-prog*0.7,gy-9);
    cx.drawImage(KID3,doorX+18-prog*0.55,gy-9);
    if(frame%10===0)parts.push({x:player.x+5,y:player.y-6,vx:(Math.random()-0.5),vy:-0.8,t:0,life:25,col:'#ff5577'});
  }
  if(t>200)centerText(cx,'FAMILY SAVED!',20,'#7dff7d');
  if(t>340){state='PHOTO';sceneT=0;}
}
function drawPhoto(){
  const t=sceneT;
  // warm backdrop
  const g=cx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0,'#ffb85a');g.addColorStop(1,'#ff7a9c');
  cx.fillStyle=g;cx.fillRect(0,0,VW,VH);
  // confetti
  for(let i=0;i<40;i++){
    const px=(i*53+frame*(1+i%3)*0.4)%VW, py=(i*37+frame*(0.5+i%2))%VH;
    cx.fillStyle=['#ffd23f','#7dff7d','#7df','#ff5577','#fff'][i%5];
    cx.fillRect(px,py,2,3);
  }
  // photo frame
  const fw=Math.min(VW-24,190), fh=Math.min(VH-30,110);
  const fx=(VW-fw)/2, fy=(VH-fh)/2-4;
  cx.fillStyle='#8a5a24';cx.fillRect(fx-5,fy-5,fw+10,fh+10);
  cx.fillStyle='#ffd23f';cx.fillRect(fx-3,fy-3,fw+6,fh+6);
  cx.fillStyle='#c8ecff';cx.fillRect(fx,fy,fw,fh);
  cx.fillStyle='#8fd4ff';cx.fillRect(fx,fy,fw,fh*0.55);
  cx.fillStyle='#2e9c40';cx.fillRect(fx,fy+fh*0.72,fw,fh*0.28);
  // family lineup scaled 2x centered
  const cxm=fx+fw/2, by=fy+fh*0.78;
  cx.imageSmoothingEnabled=false;
  cx.drawImage(Z_IDLE,cxm-46,by-44,24,44);
  cx.drawImage(HUSB,cxm-16,by-26,20,26);
  cx.drawImage(KID1,cxm+8,by-18,16,18);
  cx.drawImage(KID2,cxm+26,by-18,16,18);
  cx.drawImage(KID3,cxm+44,by-18,16,18);
  // hearts
  for(let i=0;i<3;i++)cx.drawImage(HEART,cxm-30+i*24,fy+8+Math.sin(frame*0.1+i)*2);
  outText(cx,'ONE HAPPY FAMILY',cxm-textW('ONE HAPPY FAMILY')/2,fy+fh-10,'#1a1028','#fff');
  if(t>90&&frame%60<40)centerText(cx,'TAP TO CONTINUE',VH-10,'#fff');
  if(anyPressEdge&&t>90){state='SCORE';sceneT=0;
    if(score>best){best=score;localStorage.setItem('zarnaBest',best);}
  }
}
function drawScore(){
  cx.fillStyle='#1a1028';cx.fillRect(0,0,VW,VH);
  bigTextC('FAMILY SAVED.',VH*0.15,2,'#7dff7d','#000');
  bigTextC('MOTHER-IN-LAW',VH*0.15+20,1,'#ff9db0','#000');
  bigTextC('STILL DISAPPOINTED.',VH*0.15+30,1,'#ff9db0','#000');
  const cyy=VH*0.15+50;
  centerText(cx,'SCORE: '+score,cyy,'#ffd23f');
  centerText(cx,'PINEAPPLES: '+pineCount,cyy+12,'#ffd23f');
  centerText(cx,'TIME: '+Math.floor(levelTime/60)+'S',cyy+24,'#8fd4ff');
  centerText(cx,'BEST: '+best,cyy+36,'#7df');
  if(score>=best&&score>0)centerText(cx,'NEW BEST! AUNTIES ARE SEETHING.',cyy+48,'#7dff7d');
  if(frame%60<40&&sceneT>60)centerText(cx,'TAP FOR TITLE',VH-14,'#fff');
  if(anyPressEdge&&sceneT>60){state='TITLE';sceneT=0;rescued=false;finishBonus=false;setTrack(TR_TITLE);}
}

// ============ MAIN LOOP ============
resetRun(-1);
state='TITLE';

function sceneUpdateFX(){
  for(const o of parts){o.t++;o.x+=o.vx;o.y+=o.vy;o.vy+=0.03;}
  parts=parts.filter(o=>o.t<o.life);
  for(const o of pops)o.t++;
  pops=pops.filter(o=>o.t<50);
}
(function(){
  let last='TITLE';
  function loop(){
    requestAnimationFrame(loop);
    if(state!==last){sceneT=0;last=state;}
    frame++;sceneT++;
    if(fitKey()!==lastFit)fit();
    if(AC&&!curTrack&&state==='TITLE')setTrack(TR_TITLE);
    if(state==='TITLE')drawTitle();
    else if(state==='INTRO')drawIntro();
    else if(state==='PLAY'){
      updatePlay();
      drawBG();drawWires();drawTiles();drawProps();drawEnts();drawPlayer();drawFX();drawHUD();
    }
    else if(state==='GAMEOVER'){drawGameOver();}
    else if(state==='RESCUE'){sceneUpdateFX();drawRescue();}
    else if(state==='PHOTO')drawPhoto();
    else if(state==='SCORE')drawScore();
    anyPressEdge=false;jumpPressed=false;firePressed=false;
  }
  loop();
})();
</script>
